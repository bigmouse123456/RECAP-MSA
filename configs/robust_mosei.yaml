# RobustMSA: missing-aware, interpretable model for the 2026 E-problem
# (CMU-MOSEI subset, Attachment 2 unaligned_50.pkl).
seed: 1111
checkpoint_dir: ckpt/robust_mosei
checkpoint_tag: robust_v1

data:
  path: data/mosei/unaligned_50.pkl
  # precomputed: use the 50x768 `text` field (same interface as Attachment 3,
  #              whose text missing spans are zero rows in this field).
  # bert:        fine-tune the top BERT layers from `text_bert` (slower).
  text_source: precomputed
  batch_size: 32
  num_workers: 4
  augment:
    span_prob: 0.5          # chance that a modality gets contiguous zero spans
    min_ratio: 0.1          # share of the valid length that is zeroed
    max_ratio: 0.6
    max_spans: 3
    modality_drop_prob: 0.1 # chance to drop one whole modality
  valid_missing_seed: 2026  # fixed corruption for the "missing" validation view

model:
  hidden_dim: 128
  heads: 4
  layers: 2
  dropout: 0.2
  input_dropout: 0.1
  fusion_dropout: 0.3
  input_dims: {text: 768, audio: 74, vision: 35}
  max_len: {text: 50, audio: 500, vision: 500}
  # Average-pool 500 unaligned frames into 100 steps: less noise, 25x cheaper
  # attention, and evidence is still localized to 5-frame windows.
  downsample: {text: 1, audio: 5, vision: 5}
  bert_pretrained: bert-base-uncased
  bert_frozen_layers: 8

loss:
  cls: 0.5
  unimodal: 0.2
  corr: 0.1
  label_smoothing: 0.1

optim:
  lr: 0.0005
  bert_lr: 0.00002
  weight_decay: 0.01
  epochs: 60
  warmup_epochs: 3
  grad_clip: 1.0
  early_stopping_patience: 12

selection:
  # Model selection is classification-first: average the complete/missing
  # validation views, then maximize 0.6 Macro-F1 + 0.4 Accuracy.
  # Regression safeguards (MAE <= baseline + 0.01 and Corr >= baseline - 0.01)
  # are applied across candidate configurations by run_loss_tuning.py.
  views: {complete: 0.5, missing: 0.5}
  metrics: {Polarity_Macro_F1: 0.6, Polarity_Accuracy: 0.4}
  # The post-training logit-bias / intensity-threshold search uses the same
  # validation-only objective. Attachment 3/4 are never used for tuning.
  decision: {f1_weight: 0.6, accuracy_weight: 0.4}
