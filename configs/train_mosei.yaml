base:
  seed: 1111
  lr: 0.0001
  weight_decay: 0.0001
  batch_size: 64
  n_epochs: 200
  num_workers: 8
  adv: 0.01
  recon: 0.1 
  task: 1.0
  task_reg: 1.0
  task_cls: 0.4
  task_modal: 0.1
  task_corr: 0.1
  task_order: 0.05
  task_consistency: 0.05
  mae_mix: 0.5
  para_rank: 0.01
  bert_lr: 0.00001
  generator_lr: 0.00001
  stage2_lr: 0.00005
  stage2_weight_decay: 0.001
  freeze_stage1_backbone: true
  finetune_generator: false
  recovery_mode: residual
  completion_residual_scale: 0.25
  modality_dropout: 0.1
  head_dropout: 0.35
  fusion_dropout: 0.35
  label_smoothing: 0.05
  checkpoint_tag: regularized_v4
  early_stopping_patience: 12
  selection_corr_weight: 0.5
  selection_mae_weight: 0.5
  paraSSL_LV: 0.001
  paraSSL_LA: 0.001
  paraSSL_VA: 0.001
  train_mode: regression # only support regression now
  missing_rate_eval_test: 0.5   # used for evaluation and testing
  do_validation: true
  stage: completion
  n_epochs_stage1: 200
  n_epochs_stage2: 200


dataset:
  datasetName: mosei
  dataPath: data/mosei/unaligned_50.pkl
   

model:    
  feature_extractor:
    bert_pretrained: 'bert-base-uncased'
    input_length: [50, 500, 500] # language, video, audio
    token_length: [8, 8, 8] # language, video, audio
    heads: 8
    input_dims: [768, 35, 74] # language, video, audio
    hidden_dims: [128, 128, 128] # language, video, audio
    depth: 2

  reconstructor:
    input_length: 8
    depth: 2
    heads: 8
    input_dim: 128
    hidden_dim: 128


  fusion:
    atten_projection:
      input_length: 8
      token_length: 8
      depth: 2
      heads: 8
      input_dim: 128
      hidden_dim: 128
    
    modal_predictors:
      input_length: 8
      token_length: 8
      depth: 2
      heads: 8
      input_dim: 128
      hidden_dim: 128
      transformer_depth: 2
      transformer_heads: 4
      
    final_predictor:
      input_length: 8
      token_length: 8
      depth: 2
      heads: 8
      input_dim: 128
      hidden_dim: 128
      transformer_depth: 2
      transformer_heads: 4

  GAN:
    generator:
      input_length: 8
      token_length: 8
      depth: 2
      input_dim: 128
      hidden_dim: 128
      latent_dim: 128

    discriminator:
      input_length: 8
      token_length: 8
      depth: 2
      input_dim: 128
      hidden_dim: 128
      latent_dim: 128
